<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生物医药产业</title><style>body{margin:0;background:#f3f0e8;color:#24231f;font:16px/1.85 Georgia,"Noto Serif SC",serif}main{max-width:850px;margin:auto;padding:55px 26px}a{color:#a34f3e;text-decoration:none}h1{font-size:48px;font-weight:500}h2{font-weight:500;border-bottom:1px solid #c9c3b8;padding-bottom:8px;margin-top:35px}</style></head><body><main><a href="index.html">← 医学</a><h1>生物医药产业</h1><p>企业索引与研发流程笔记。企业管线、组织架构和招聘需求变化较快，具体信息应以公司官网、年报和招聘页面为准。</p><h2>国内企业索引</h2><ul><li><a href="https://www.beigene.com/">百济神州（BeiGene）</a>：创新药研发与商业化，重点布局肿瘤领域。</li><li><a href="https://www.innoventbio.com/">信达生物（Innovent Biologics）</a>：生物药研发与商业化，覆盖肿瘤及其他治疗领域。</li></ul><h2>研发链条</h2><p>靶点发现与验证 → 候选分子发现 → 先导优化 → 临床前研究（药效、药代、毒理）→ IND申报 → 临床I/II/III期 → 注册审批 → 上市后监测。计算生物学、结构生物学、药物化学、药理毒理、临床开发和生物统计在不同阶段承担不同任务。</p></main></body></html>
