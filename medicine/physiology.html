<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人体生理学</title><style>body{margin:0;background:#f3f0e8;color:#24231f;font:16px/1.85 Georgia,"Noto Serif SC",serif}main{max-width:850px;margin:auto;padding:55px 26px}a{color:#a34f3e;text-decoration:none}h1{font-size:48px;font-weight:500}h2{font-weight:500;border-bottom:1px solid #c9c3b8;padding-bottom:8px;margin-top:35px}.note{background:#e9e4d9;padding:16px}</style></head><body><main><a href="index.html">← 医学</a><h1>人体生理学</h1><h2>施万细胞（Schwann cell）</h2><p>施万细胞是周围神经系统的主要胶质细胞，包裹周围神经轴突并支持轴突存活、髓鞘形成和神经损伤后的修复。一个有髓施万细胞通常围绕一段轴突形成一个髓鞘节段；无髓施万细胞则可包裹多个细小轴突但不形成典型多层髓鞘。</p><p>与中枢神经系统的少突胶质细胞相比，施万细胞主要位于周围神经系统；一个少突胶质细胞可为多个轴突的多个节段形成髓鞘，而施万细胞通常负责单个轴突的单个节段。</p><div class="note">功能关键词：髓鞘、郎飞结、跳跃式传导、轴突支持、Wallerian degeneration、周围神经再生。</div></main></body></html>
