<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4f1eb">
<meta name="description" content="个人作品档案，收录文字创作、视觉实验、设计与研究记录。">
<meta property="og:type" content="website">
<meta property="og:title" content="Personal Archive — 作品档案">
<meta property="og:description" content="一个持续生长的个人作品空间。">
<meta property="og:url" content="https://2763005821.github.io/Favier.github.io/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23242520'/%3E%3Cpath d='M12 9h18v4H17v6h11v4H17v9h-5z' fill='%23f4f1eb'/%3E%3C/svg%3E">
<title>Personal Archive — 作品档案</title>
<style>
:root{
  --bg:#f1efe8;--paper:#f7f5ef;--ink:#20211e;--muted:#77776f;
  --line:#bdbbb2;--accent:#b33b2e;--accent-soft:#e9ddd5;
  --olive:#5d6550;--shadow:none;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{color:inherit}
.wrap{width:min(1240px,calc(100% - 64px));margin:auto}
header{padding:18px 0;border-bottom:1px solid var(--ink)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:20px}
.brand{font-size:12px;font-weight:700;letter-spacing:.13em}
.nav-right{display:flex;gap:18px;align-items:center;color:var(--muted);font-size:12px}
.nav-right a{text-decoration:none}
.nav-right a:hover{color:var(--accent)}
.hero{padding:76px 0 62px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(220px,.6fr);gap:60px;align-items:end}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:"Noto Serif SC","Songti SC",SimSun,serif;font-size:clamp(46px,7.4vw,98px);line-height:1.03;letter-spacing:-.055em;font-weight:600;margin:18px 0 24px}
.hero p{max-width:540px;color:#5e5f58;font-size:14px;margin:0}
.hero-note{border-top:2px solid var(--ink);padding:14px 0 0;color:var(--muted);font-size:12px}
.hero-note strong{display:block;color:var(--ink);font-family:Georgia,serif;font-size:28px;font-weight:400;margin-bottom:8px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:14px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.filters{display:flex;gap:0;flex-wrap:wrap}
.filter{border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 15px;font-size:12px}
.filter:first-child{padding-left:0}
.filter.active{color:var(--accent);font-weight:700;background:transparent}
.tools{display:flex;gap:8px;align-items:center}
.search{width:190px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 4px;font-size:12px;outline:none}
.search:focus{border-color:var(--accent)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:0;padding:9px 14px;font-size:11px;transition:background .15s,color .15s}
.btn:hover{background:var(--accent);border-color:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{color:var(--paper);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:0 0 82px;border-left:1px solid var(--line)}
.work{background:transparent;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;cursor:pointer;transition:background .18s}
.work:hover{transform:none;box-shadow:none;background:#e9e6dd}
.cover{height:240px;position:relative;overflow:hidden;background:#d7d4cb;border-bottom:1px solid var(--line)}
.cover img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.78);transition:filter .25s}
.work:hover .cover img{transform:none;filter:saturate(1)}
.cover-placeholder{height:100%;display:flex;align-items:flex-end;justify-content:flex-start;text-align:left;padding:22px;font-family:"Noto Serif SC","Songti SC",SimSun,serif;font-size:clamp(25px,3vw,42px);line-height:1.18;letter-spacing:-.04em;color:#34352f;background:#d8d5ca!important}
.work:nth-child(3n+2) .cover-placeholder{background:#d4d8d0!important}
.work:nth-child(3n) .cover-placeholder{background:#ded1c5!important}
.cover-mark{position:absolute;top:12px;left:12px;background:var(--bg);padding:4px 7px;font-size:9px;letter-spacing:.08em}
.work-body{padding:17px 19px 20px}
.work-meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.work h2{font-family:"Noto Serif SC","Songti SC",SimSun,serif;font-weight:600;font-size:23px;letter-spacing:-.025em;margin:11px 0 8px}
.work p{color:#696a63;font-size:12px;margin:0;min-height:42px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:17px}
.tag{font-size:10px;color:var(--olive);background:transparent;border:1px solid #c7c8bc;padding:3px 7px;border-radius:0}
.empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--muted);border:1px dashed var(--line)}
footer{border-top:1px solid var(--ink);padding:22px 0 36px;color:var(--muted);font-size:10px;display:flex;justify-content:space-between;gap:20px;letter-spacing:.04em}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,21,18,.68);display:none;align-items:center;justify-content:center;padding:22px;z-index:5}
.modal-backdrop.show{display:flex}
.modal{background:var(--paper);width:min(680px,100%);max-height:90vh;overflow:auto;box-shadow:none;border:1px solid var(--ink);position:relative}
.modal-inner{padding:30px}
.modal-close{position:absolute;right:12px;top:8px;border:0;background:var(--paper);font-size:25px;color:var(--ink);line-height:1}
.modal h2{font:600 34px/1.2 "Noto Serif SC","Songti SC",SimSun,serif;margin:10px 0}
.modal p{color:var(--muted);font-size:14px;white-space:pre-wrap}
.modal-cover{width:100%;max-height:330px;object-fit:cover;display:block;background:#e4dfd3}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);background:#fff;padding:10px 11px;color:var(--ink);outline:none;border-radius:0}
.field textarea{min-height:105px;resize:vertical}
.form-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:5px}
.notice{font-size:11px;color:var(--muted);margin-top:10px}
@media(max-width:800px){.wrap{width:calc(100% - 36px)}.hero{grid-template-columns:1fr;gap:25px;padding:55px 0}.hero-note{max-width:420px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cover{height:210px}}
@media(max-width:560px){.wrap{width:calc(100% - 28px)}.nav-right a{display:none}.nav-right{gap:8px}.toolbar{align-items:flex-start;flex-direction:column}.tools{width:100%}.search{flex:1;width:auto}.grid{grid-template-columns:1fr;margin-bottom:54px}.cover{height:230px}.hero{padding:45px 0}.form{grid-template-columns:1fr}.field.full,.form-actions{grid-column:auto}footer{flex-direction:column}}

</style>
</head>
<body>
<header><div class="wrap nav">
  <div class="brand">PERSONAL ARCHIVE<span style="color:var(--accent)">.</span></div>
  <nav class="nav-right"><a href="#works">作品</a><a href="#about">关于</a><a href="bioinformatics/index.html">生物信息学</a><button class="btn ghost" id="importBtn">导入数据</button><button class="btn ghost" id="exportBtn">导出数据</button><input id="importFile" type="file" accept="application/json,.json" hidden></nav>
</div></header>
<main class="wrap">
  <section class="hero" id="about">
    <div>
      <div class="eyebrow">PERSONAL INDEX / 2026</div>
      <h1>作品，<br>以及它们的来处。</h1>
      <p>一个持续更新的个人档案。收录文字、视觉、设计与研究记录。</p>
    </div>
    <div class="hero-note"><strong>Selected works</strong>按类别整理的作品索引。选择条目，查看作品说明与相关链接。</div>
  </section>
  <section id="works">
    <div class="toolbar">
      <div class="filters" id="filters">
        <button class="filter active" data-filter="全部">全部</button>
        <button class="filter" data-filter="文字">文字</button>
        <button class="filter" data-filter="视觉">视觉</button>
        <button class="filter" data-filter="设计">设计</button>
        <button class="filter" data-filter="实验">实验</button>
      </div>
      <div class="tools"><input class="search" id="search" placeholder="搜索作品…" aria-label="搜索作品"><button class="btn" id="addBtn">＋ 添加作品</button></div>
    </div>
    <div class="grid" id="workGrid"></div>
  </section>
</main>
<footer class="wrap"><span>© <span id="year"></span> PERSONAL ARCHIVE</span><span>A working archive · Selected records</span></footer>

<div class="modal-backdrop" id="detailBackdrop">
  <article class="modal"><button class="modal-close" data-close="detailBackdrop" aria-label="关闭">×</button><img class="modal-cover" id="detailImage" alt=""><div class="modal-inner"><div class="eyebrow" id="detailCategory"></div><h2 id="detailTitle"></h2><div class="work-meta"><span id="detailDate"></span><span id="detailTags"></span></div><p id="detailDescription"></p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:22px"><a class="btn" id="detailLink" href="#" target="_blank" rel="noopener" style="display:none;text-decoration:none">打开作品 ↗</a><button class="btn ghost" id="deleteBtn">删除此作品</button></div></div></article>
</div>

<div class="modal-backdrop" id="formBackdrop">
  <section class="modal"><button class="modal-close" data-close="formBackdrop" aria-label="关闭">×</button><div class="modal-inner">
    <div class="eyebrow">Add to archive</div><h2>添加一件作品</h2>
    <form class="form" id="workForm">
      <label class="field">作品标题<input name="title" required maxlength="80" placeholder="例如：夏日手记"></label>
      <label class="field">作品类别<select name="category"><option>文字</option><option>视觉</option><option>设计</option><option>实验</option></select></label>
      <label class="field">日期<input name="date" type="date"></label>
      <label class="field">标签<input name="tags" placeholder="小说, 随笔, 原型"></label>
      <label class="field full">简短介绍<textarea name="description" required maxlength="1000" placeholder="介绍作品的主题、背景或创作过程……"></textarea></label>
      <label class="field full">封面图片（可选）<input name="image" type="file" accept="image/*"></label>
      <label class="field full">作品链接（可选）<input name="link" type="url" placeholder="https://..."></label>
      <div class="form-actions"><button type="button" class="btn ghost" data-close="formBackdrop">取消</button><button class="btn" type="submit">保存作品</button></div>
    </form>
    <div class="notice">提示：这是纯前端测试版。作品和图片保存在当前浏览器的本地存储中，清理浏览器数据可能导致内容丢失；其他访客暂时看不到你添加的作品。</div>
  </div></section>
</div>
<script>
const starterWorks = [
 {id:"sample-1",title:"夏恋梦之歌",category:"文字",date:"2026-11-18",tags:["小说","长篇创作"],description:"一部仍在持续生长的长篇作品。这里可以放置故事简介、创作缘起、章节入口，以及你希望读者首先感受到的主题。",tone:"#d8c9b8",image:"",link:""},
 {id:"sample-2",title:"形状与留白",category:"视觉",date:"2026-10-12",tags:["视觉实验","构图"],description:"记录一次关于形状、色彩与空间关系的视觉练习。可以在这里补充作品说明、使用工具和创作过程。",tone:"#b9c3b0",image:"",link:""},
 {id:"sample-3",title:"交互原型 01",category:"设计",date:"2026-09-26",tags:["UI","原型"],description:"一个用于测试信息组织和交互流程的小型原型。后续可以替换为真实项目截图、在线演示地址或设计文档。",tone:"#c5c5d1",image:"",link:""},
 {id:"sample-4",title:"数据与生命",category:"实验",date:"2026-08-08",tags:["研究","数据分析"],description:"用于展示研究项目、数据可视化、实验流程或阶段性发现。建议明确写出问题、方法和主要结果。",tone:"#d6c6a4",image:"",link:""}
];
const API_BASE_URL = ""; // 部署 Worker 后填写完整 API 根地址，例如 https://favier-archive-api.example.workers.dev
const remoteMode = Boolean(API_BASE_URL);
const KEY="personal_archive_works_v1";
let works=[];
if (!remoteMode) {
 try { const saved=JSON.parse(localStorage.getItem(KEY)); works=Array.isArray(saved)?saved.filter(x=>x&&typeof x==="object"&&typeof x.title==="string").map(normalizeWork):starterWorks; } catch(e) { works=starterWorks; }
}
let activeFilter="全部", currentId=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(works));return true;}catch(e){alert("本地存储空间不足。请减少图片大小后重试。");return false;}}
function safeImage(value){if(typeof value!=="string"||value.length>1300000)return "";if(/^data:image\/(?:png|jpeg|webp);base64,/i.test(value))return value;try{const u=new URL(value);return u.protocol==="https:"?u.href:"";}catch{return "";}}
function safeLink(value){try{const u=new URL(value);return ["https:","http:"].includes(u.protocol)?u.href:"";}catch{return "";}}
function normalizeWork(w){return {id:String(w.id||("work-"+Date.now()+"-"+Math.random().toString(36).slice(2,7))),title:String(w.title||"未命名作品").slice(0,80),category:["文字","视觉","设计","实验"].includes(w.category)?w.category:"实验",date:String(w.date||""),tags:Array.isArray(w.tags)?w.tags.map(String).slice(0,20):[],description:String(w.description||"").slice(0,5000),image:safeImage(w.image),link:safeLink(w.link),tone:/^#[0-9a-f]{3,8}$/i.test(w.tone||"")?w.tone:"#d8c9b8"};}
function render(){
 const q=$("search").value.trim().toLowerCase();
 const list=works.filter(w=>(activeFilter==="全部"||w.category===activeFilter)&&[w.title,w.description,(w.tags||[]).join(" ")].join(" ").toLowerCase().includes(q));
 $("workGrid").innerHTML=list.length?list.map(w=>`
  <article class="work" data-id="${esc(w.id)}" tabindex="0" role="button" aria-label="查看${esc(w.title)}">
   <div class="cover">${w.image?`<img src="${esc(safeImage(w.image))}" alt="${esc(w.title)}封面">`:`<div class="cover-placeholder" style="background:${w.tone||"#d9d5c9"}">${esc(w.title)}</div>`}<span class="cover-mark">${esc(w.category)}</span></div>
   <div class="work-body"><div class="work-meta"><span>${esc(w.date||"未注明日期")}</span><span>VIEW ↗</span></div><h2>${esc(w.title)}</h2><p>${esc(w.description)}</p><div class="tags">${(w.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div></div>
  </article>`).join(""):`<div class="empty">没有找到匹配的作品。<br>试试其他关键词，或添加一件新作品。</div>`;
 document.querySelectorAll(".work").forEach(el=>{
  const open=()=>showDetail(el.dataset.id);
  el.addEventListener("click",open);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}});
 });
}
function showDetail(id){
 const w=works.find(x=>x.id===id);if(!w)return;currentId=id;
 const detailImage=safeImage(w.image);$("detailImage").style.display=detailImage?"block":"none";$("detailImage").src=detailImage;
 $("detailCategory").textContent=w.category;$("detailTitle").textContent=w.title;
 $("detailDate").textContent=w.date||"未注明日期";$("detailTags").textContent=(w.tags||[]).join(" · ");
 $("detailDescription").textContent=w.description+(w.show_extract_code&&w.extract_code?"\n\n百度网盘提取码："+w.extract_code:"");
 const detailLink=safeLink(w.link);$("detailLink").style.display=detailLink?"inline-block":"none";$("detailLink").href=detailLink||"#";
 $("detailBackdrop").classList.add("show");
}
function closeModal(id){$(id).classList.remove("show");}
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>closeModal(b.dataset.close)));
document.querySelectorAll(".modal-backdrop").forEach(b=>b.addEventListener("click",e=>{if(e.target===b)b.classList.remove("show");}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".modal-backdrop").forEach(m=>m.classList.remove("show"));});
async function refreshRemote(){
 if(!remoteMode)return;
 const params=new URLSearchParams();
 const q=$("search").value.trim();
 if(q)params.set("q",q);
 if(activeFilter!=="全部")params.set("category",activeFilter);
 params.set("page_size","30");
 try{
  const response=await fetch(API_BASE_URL.replace(/\/$/,"")+"/api/works?"+params.toString(),{headers:{"Accept":"application/json"}});
  if(!response.ok)throw new Error("API 请求失败（HTTP "+response.status+"）");
  const payload=await response.json();
  if(!payload.ok||!Array.isArray(payload.data))throw new Error(payload.error||"API 返回格式不正确");
  works=payload.data.map(normalizeWork);
  render();
 }catch(error){
  $("workGrid").innerHTML="<div class=\"empty\">暂时无法连接作品数据库。<br>请检查 API 地址和 Cloudflare Worker 部署状态。<br><small>"+esc(error.message)+"</small></div>";
 }
}
$("filters").addEventListener("click",e=>{const b=e.target.closest("[data-filter]");if(!b)return;activeFilter=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));remoteMode?refreshRemote():render();});
let searchTimer;
$("search").addEventListener("input",()=>{if(!remoteMode){render();return;}clearTimeout(searchTimer);searchTimer=setTimeout(refreshRemote,220);});
$("addBtn").addEventListener("click",()=>$("formBackdrop").classList.add("show"));
$("workForm").addEventListener("submit",async e=>{
 e.preventDefault();const f=e.currentTarget,fd=new FormData(f);let image="";
 const file=fd.get("image");
 if(file&&file.size){
  if(!["image/jpeg","image/png","image/webp"].includes(file.type)){alert("封面仅支持 JPG、PNG 或 WebP。");return;}
  if(file.size>900*1024){alert("为了避免占满浏览器存储，封面图片请控制在 900KB 以内。");return;}
  image=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});
 }
 const item={id:"work-"+Date.now(),title:fd.get("title").trim(),category:fd.get("category"),date:fd.get("date"),tags:fd.get("tags").split(/[,，]/).map(x=>x.trim()).filter(Boolean),description:fd.get("description").trim(),image,link:fd.get("link").trim(),tone:"#d8c9b8"};
 works.unshift(item);persist();f.reset();closeModal("formBackdrop");activeFilter="全部";document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x.dataset.filter==="全部"));render();
});
$("deleteBtn").addEventListener("click",()=>{if(!currentId)return;if(confirm("确定删除这件作品吗？此操作无法撤销。")){works=works.filter(w=>w.id!==currentId);persist();closeModal("detailBackdrop");render();}});
$("exportBtn").addEventListener("click",()=>{
 const payload={version:1,exportedAt:new Date().toISOString(),works};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="personal-archive-backup.json";a.click();URL.revokeObjectURL(url);
});
$("importBtn").addEventListener("click",()=>$("importFile").click());
$("importFile").addEventListener("change",async e=>{
 const file=e.target.files[0];if(!file)return;
 try{
  if(file.size>5*1024*1024)throw new Error("文件不能超过 5 MB。");
  const data=JSON.parse(await file.text()),items=Array.isArray(data)?data:data.works;
  if(!Array.isArray(items))throw new Error("JSON 中没有作品数组。");
  if(items.length>200)throw new Error("单次最多导入 200 件作品。");
  const imported=items.filter(x=>x&&typeof x==="object"&&typeof x.title==="string").map(normalizeWork);
  if(!confirm("导入将替换当前浏览器中的 "+works.length+" 件作品，导入 "+imported.length+" 件。建议先导出备份。继续吗？"))return;
  works=imported;
  if(persist())render();
 }catch(err){alert("导入失败："+err.message);}
 finally{e.target.value="";}
});
$("year").textContent=new Date().getFullYear();
if(remoteMode){
 $("addBtn").hidden=true;$("importBtn").hidden=true;$("exportBtn").hidden=true;$("deleteBtn").hidden=true;
 document.querySelector(".notice").textContent="当前连接远程作品数据库。此版本暂不开放网页端编辑；请使用 backend/README.md 中的导入工具管理作品。百度网盘分享链接由数据库统一提供。";
 refreshRemote();
}else{render();}
</script>
</body>
</html>
